name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the surface (Now, Hourly, Daily, Details) and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device/emulator, Android version, app commit, and build type.
  - type: textarea
    id: data
    attributes:
      label: Data context
      description: If the bug concerns weather values, identify the source, valid time, units, and whether it is observed/forecast/derived when known.
